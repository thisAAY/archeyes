<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArchEyes — Editable plan canvas</title>
<link rel="stylesheet" href="_ds/archeyes-design-system-eaa862b4-8285-4d1a-9b6b-2710dee72e9e/styles.css">
<style>
html,body{height:100%}
#root{height:100%}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover);text-decoration:underline}
@keyframes ax-spin{to{transform:rotate(360deg)}}
.ax-spin{animation:ax-spin .9s linear infinite}
@keyframes ax-dot{0%,100%{opacity:1}50%{opacity:.3}}
.ax-dot-pulse{animation:ax-dot 1.1s var(--ease-inout) infinite}
.ax-pulse-chip{border-color:var(--accent)!important}
@keyframes ax-ring{0%{box-shadow:0 0 0 0 var(--accent-glow)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ax-arrived-ring{animation:ax-ring 1.6s var(--ease-out) 3;outline:2px solid var(--accent);outline-offset:2px}
@keyframes ax-toast-in{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.ax-toast{animation:ax-toast-in var(--dur-slow) var(--ease-out)}
@keyframes ax-hint-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.ax-hint{animation:ax-hint-in var(--dur-slow) var(--ease-out) both}
.ax-hint:nth-child(2){animation-delay:.08s}
.ax-hint:nth-child(3){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){.ax-spin,.ax-dot-pulse,.ax-arrived-ring,.ax-toast,.ax-hint{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/archeyes-design-system-eaa862b4-8285-4d1a-9b6b-2710dee72e9e/_ds_bundle.js"></script>
<script type="text/babel" data-presets="react" src="proto/data.jsx"></script>
<script type="text/babel" data-presets="react" src="proto/Header.jsx"></script>
<script type="text/babel" data-presets="react" src="proto/Canvas.jsx"></script>
<script type="text/babel" data-presets="react" src="proto/Panel.jsx"></script>
<script type="text/babel" data-presets="react" src="proto/App.jsx"></script>
<script type="text/babel" data-presets="react">
const App = window.AXApp;
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
